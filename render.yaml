services:
  - type: web
    name: stickbot-github-render
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: MOVE_DELAY_MS
        value: "3500"
      - key: AUTO_REFRESH_MINUTES
        value: "5"
      - key: DATA_FILE
        value: data/sticky-messages.json
